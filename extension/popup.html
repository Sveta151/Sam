<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Save to PaperPilot</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system; margin: 12px; width: 320px; }
      label { display: block; font-size: 12px; color: #555; margin-top: 8px; }
      input, select { width: 100%; padding: 6px 8px; margin-top: 4px; }
      button { margin-top: 12px; width: 100%; padding: 8px 10px; background: #4f46e5; color: white; border: 0; border-radius: 6px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h3 style="margin:0 0 8px 0">Save to PaperPilot</h3>
    <div id="status" style="font-size:12px;color:#666;margin-bottom:8px">Parsing current tab…</div>

    <label>Title</label>
    <input id="title" placeholder="Detected title" />

    <label>Authors (comma separated)</label>
    <input id="authors" placeholder="e.g., Jane Doe, John Roe" />

    <div style="font-size:12px;color:#666;margin-top:8px">
      Destination: <strong>Extension Inbox / Quick Saves</strong>
    </div>

    <button id="save">Save</button>

    <script src="popup.js"></script>
  </body>
</html>
